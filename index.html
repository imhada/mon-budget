<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>H.A.Z.E.L</title>
  <meta name="apple-mobile-web-app-title" content="H.A.Z.E.L">
  <meta name="application-name" content="H.A.Z.E.L">
  <meta name="theme-color" content="#E7E9FA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  
  <!-- Ingestion de la bibliothèque Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <style>
  :root{
    /* DA : fond lavande, accent indigo, cartes blanches très arrondies, pastilles, montants positifs en vert */
    --navy:#1A2138; --bg:#EEF0FA; --card:#FFFFFF; --cyan:#5B5CEB; --cyan-soft:#ECEBFD; --cyan-mid:#B9B8F8;
    --grey:#5E6B8A; --rail:#ECEEF6; --up:#2E9E6A; --up-soft:#E5F5EC; --down:#D14343; --down-soft:#FBE8E8;
    --c1:#4C7DF0; --c2:#F2A33A; --c3:#2DB3A3; --hover:#E7E9F3;
    --shadow:0 1px 2px rgba(60,64,140,.04),0 10px 30px rgba(60,64,140,.07);
    --shadow-lg:0 4px 12px rgba(60,64,140,.10),0 22px 48px rgba(60,64,140,.18);
    --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --r:24px; --navw:84px;
    color-scheme:light;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);color:var(--navy);margin:0;padding:0}
  body{background:linear-gradient(180deg,#E7E9FA 0,#F3F4FB 420px,var(--bg) 100%) fixed}
  body{font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 104px}
  @media (min-width:900px){body{padding-left:calc(var(--navw) + max(32px,env(safe-area-inset-left,0px)));padding-right:max(32px,env(safe-area-inset-right,0px));padding-block:28px 48px}}
  .wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
  main{display:flex;flex-direction:column;gap:24px}
  main.narrow{max-width:780px;width:100%;margin:0 auto}
  h1,h2{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  h1{font-size:1.5rem}
  h2{font-size:1.02rem}
  .label{font-size:.78rem;color:var(--grey);font-weight:500}
  .small{font-size:.8rem}
  .grey{color:var(--grey)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  /* En-tête */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .top-l{display:flex;flex-direction:column;gap:2px}
  .month{display:flex;align-items:center;gap:8px}
  .month b{font-size:1.5rem;font-weight:700;text-transform:capitalize;min-width:7.5ch}
  .iconbtn{background:var(--card);box-shadow:var(--shadow);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--navy)}
  .iconbtn:hover{background:var(--cyan-soft)}
  .sync{font-size:.78rem;color:var(--grey);display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);padding:6px 10px;border-radius:999px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--grey)}
  .dot.ok{background:var(--up)} .dot.local{background:var(--cyan)}

  /* Cartes */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .cardhead-r{display:flex;align-items:center;gap:10px}
  .chip{background:var(--cyan-soft);color:var(--navy);font-weight:600;font-size:.8rem;padding:6px 11px;border-radius:8px}
  .chip:hover{background:var(--cyan);}
  .btn{background:var(--cyan);color:var(--navy);font-weight:700;border-radius:8px;padding:11px 18px}
  .btn:hover{filter:brightness(1.05)}
  .btn.soft{background:var(--cyan-soft)}
  .btn.plain{background:var(--rail);color:var(--navy);font-weight:600}
  .btn.danger{background:var(--down-soft);color:var(--down);font-weight:600}
  .add{background:var(--cyan-soft);color:var(--navy);font-weight:600;border-radius:8px;padding:10px 14px;text-align:left;font-size:.9rem}
  .add:hover{background:var(--cyan-mid)}
  .empty{color:var(--grey);font-size:.9rem;padding:4px 0}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  @media (max-width:899px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
  .kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:1px;align-items:center;min-width:0}
  .kpi .ic{grid-row:span 3}
  .kpi .ic{width:38px;height:38px;border-radius:9px;background:var(--cyan-soft);color:var(--cyan);display:grid;place-items:center}
  .kpi .ic svg{width:20px;height:20px}
  .kpi .v{font-size:clamp(1.1rem,2vw,1.45rem);font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .var{font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:3px}
  .var.up{color:var(--up)} .var.down{color:var(--down)} .var.n{color:var(--grey);font-weight:500}

  /* Grille */
  .dash{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
  .col{display:flex;flex-direction:column;gap:24px;min-width:0}
  @media (min-width:900px){.dash{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}

  /* Carte reste à vivre */
  .hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
  @media (max-width:520px){.hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.hero .legend{justify-content:center}}
  .ring{position:relative;width:150px;height:150px;max-width:100%}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
  .ring .c b{font-size:1.05rem;font-weight:800}
  .hero-r{display:flex;flex-direction:column;gap:10px;min-width:0}
  .big{font-size:clamp(2rem,4vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .big.neg{color:var(--down)}
  .pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.8rem;font-weight:600}
  @media (max-width:520px){.pill{align-self:center}}
  .pill.ok{background:var(--up-soft);color:var(--up)} .pill.bad{background:var(--down-soft);color:var(--down)} .pill.info{background:var(--cyan-soft);color:var(--navy)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--grey)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .legend b{color:var(--navy);font-weight:600}

  @media (min-width:1100px) and (min-height:620px){
    html,body.fit{height:100%}
    body.fit{padding-block:20px;overflow:hidden}
    body.fit .wrap{height:100%;gap:16px}
    body.fit main{flex:1;min-height:0;gap:16px}
    body.fit .kpis{gap:16px}
    body.fit .dash{flex:1;min-height:0;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}
    body.fit .col{min-height:0;gap:16px}
    body.fit .card{padding:16px 18px;gap:10px;min-height:0}
    body.fit .card.grow{flex:1}
    body.fit .card.grow2{flex:1.4}
    body.fit .cbody{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
    body.fit .curve .cbody{overflow:hidden}
    body.fit .fab{bottom:20px}
  }
  .curve svg{width:100%;height:auto;max-height:220px;display:block;overflow:visible}

  .bar{height:6px;border-radius:3px;background:var(--rail);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:3px;background:var(--cyan)}
  .bar.over>span{background:var(--down)}
  @media (prefers-reduced-motion:no-preference){.bar>span{transition:width .4s ease}}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .envrow{background:var(--bg);border-radius:9px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
  .envrow:hover{background:var(--cyan-soft)}
  .cbody{display:flex;flex-direction:column;gap:12px;min-width:0}
  .tile{background:var(--bg);border-radius:9px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:9px;min-width:0}
  .tile:hover{background:var(--cyan-soft)}
  .line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
  .line .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .line .sub{font-size:.8rem;color:var(--grey);white-space:nowrap}
  .stack{display:flex;flex-direction:column;gap:12px}
  .proj{text-align:left;display:flex;flex-direction:column;gap:8px;border-radius:8px}
  .proj:hover .name{color:var(--cyan)}
  .kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-size:.92rem}
  .kv+.kv{box-shadow:inset 0 1px 0 var(--rail)}
  .kv .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .kv.total{font-weight:700}
  .tag{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--rail);color:var(--grey);margin-left:8px;font-weight:500;white-space:nowrap}
  .plus{color:var(--up);font-weight:600}

  .list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:14px 18px;width:100%;text-align:left}
  .row+.row{box-shadow:inset 0 1px 0 var(--rail)}
  .row:hover{background:var(--bg)}
  .row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .amt{font-weight:700;white-space:nowrap}
  .grouphead{display:flex;justify-content:space-between;padding:14px 18px 6px;font-size:.78rem;color:var(--grey);font-weight:600}
  .list .empty{padding:20px 18px}
  .note{font-size:.86rem;color:var(--grey);max-width:65ch;margin:0}
  .sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .sechead .t{font-size:1.15rem;font-weight:800}
  .projcard{display:flex;flex-direction:column;gap:12px}
  .projcard .actions{display:flex;gap:8px;flex-wrap:wrap}

  .nav{position:fixed;z-index:5;background:var(--card);box-shadow:var(--shadow)}
  .nav .items{display:flex;gap:6px}
  .navbtn{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--grey);font-size:.68rem;font-weight:600}
  .navbtn .sq{width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
  .navbtn svg{width:22px;height:22px}
  .navbtn[aria-selected="true"]{color:var(--navy)}
  .navbtn[aria-selected="true"] .sq{background:var(--cyan);color:var(--navy)}
  .navbtn:hover .sq{background:var(--cyan-soft)}
  .navbtn[aria-selected="true"]:hover .sq{background:var(--cyan)}
  .brand{display:none}
  @media (max-width:899px){
    .nav{left:0;right:0;bottom:0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
    .nav .items{justify-content:space-around;max-width:520px;margin:0 auto}
    .navbtn .sq{width:40px;height:32px;border-radius:9px}
  }
  @media (min-width:900px){
    .nav{top:0;bottom:0;left:0;width:calc(var(--navw) + env(safe-area-inset-left,0px));padding:calc(20px + env(safe-area-inset-top,0px)) 0 20px env(safe-area-inset-left,0px);display:flex;flex-direction:column;align-items:center;gap:28px}
    .nav .items{flex-direction:column;gap:14px}
    .brand{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--navy);color:var(--card);font-weight:800;font-size:1.05rem}
  }
  .fab{position:fixed;z-index:6;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(84px + env(safe-area-inset-bottom,0px));
    background:var(--cyan);color:var(--navy);font-weight:700;border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center}
  @media (min-width:900px){.fab{bottom:calc(28px + env(safe-area-inset-bottom,0px));right:calc(max(32px,env(safe-area-inset-right,0px)))}}

  .sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(11,31,58,.35);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:14px 14px 0 0;box-shadow:var(--shadow-lg);
    padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto}
  @media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field input,.field select{font:inherit;color:var(--navy);padding:12px 13px;border-radius:8px;border:0;background:var(--bg);width:100%}
  .field input.bigin{font-size:1.6rem;font-weight:700}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{background:var(--bg);border-radius:8px;padding:7px 12px;font-size:.88rem;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--cyan);color:var(--navy);font-weight:700}
  .actions-row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .sync:hover{background:var(--cyan-soft)}
  .login{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
  .login h1{font-size:1.4rem}
  .login .row2{display:flex;gap:8px;flex-wrap:wrap}
  .login .row2 input{flex:1;min-width:0}
  .linkbtn{color:var(--grey);text-decoration:underline;font-size:.85rem;align-self:flex-start}
  body.nologin .fab{display:none}

  /* ---- Composants façon appli bancaire : pastilles, boutons ronds, barre flottante ---- */
  h2{font-size:1.08rem;font-weight:700}
  .month b{font-weight:700}
  .iconbtn{border-radius:50%;width:40px;height:40px;box-shadow:var(--shadow)}
  .iconbtn:hover,.sync:hover{background:var(--hover)}
  .sync{padding:8px 14px;font-weight:500}
  .card,.kpi,.list{border-radius:var(--r)}
  .card{padding:22px}
  .chip{background:var(--cyan-soft);color:var(--cyan);border-radius:999px;padding:7px 14px}
  .chip:hover{background:var(--cyan);color:#fff}
  .btn{background:var(--cyan);color:#fff;border-radius:999px;padding:12px 22px;font-weight:600}
  .btn:hover{filter:brightness(1.07)}
  .btn.plain{background:var(--card);color:var(--navy);box-shadow:inset 0 0 0 1px var(--rail)}
  .btn.plain:hover{background:var(--hover)}
  .btn.danger{background:var(--down-soft);color:var(--down)}
  .add{background:var(--card);color:var(--navy);border-radius:999px;padding:12px 18px;text-align:center;font-weight:600;box-shadow:inset 0 0 0 1px var(--rail)}
  .add:hover{background:var(--hover)}
  .kpi .ic{width:44px;height:44px;border-radius:50%;background:var(--cyan-soft);color:var(--cyan)}
  .kpi .v{font-weight:700}
  .pill.info{background:var(--cyan-soft);color:var(--cyan)}
  .big{font-weight:700}
  .bar{height:8px;border-radius:999px}
  .bar>span{border-radius:999px}
  .envrow,.tile{background:#F6F7FC;border-radius:18px}
  .envrow:hover,.tile:hover{background:var(--cyan-soft)}
  .row:hover{background:#F6F7FC}
  .tag{background:var(--cyan-soft);color:var(--cyan)}
  .sechead .t{font-weight:700}
  .seg{background:#F1F2F9;border-radius:999px;padding:4px;gap:4px}
  .seg button{background:none;border-radius:999px;padding:8px 14px;color:var(--grey);font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--cyan);color:#fff;font-weight:600}
  .field input,.field select{background:#F3F4FA;border-radius:14px;padding:13px 15px}
  .sheet{border-radius:28px 28px 0 0}
  @media (min-width:640px){.sheet{border-radius:28px}}
  .sheet-bg{background:rgba(26,33,56,.35)}
  .fab{background:var(--cyan);color:#fff;border-radius:999px;padding:15px 22px;box-shadow:0 10px 28px rgba(91,92,235,.38)}
  .envrow .line b{font-size:.9rem;white-space:nowrap}
  @media (max-width:560px){
    .kpi{grid-template-columns:minmax(0,1fr);row-gap:4px;padding:14px}
    .kpi .ic{grid-row:auto;width:36px;height:36px;margin-bottom:4px}
    .kpi .ic svg{width:18px;height:18px}
  }
  @media (min-width:1100px) and (min-height:620px){
    body.fit .kv{padding:6px 0}
    body.fit .card{padding:16px 20px}
    body.fit .proj{gap:6px}
  }
  /* ---- Bulles de catégorie, lignes d'opération, analyse ---- */
  .bulle{border-radius:50%;display:grid;place-items:center;flex:none;color:var(--b);background:color-mix(in srgb,var(--b) 14%,#fff)}
  .bar>span{background:var(--bc,var(--cyan))}
  .row.op{padding:12px 16px;gap:14px}
  .row .grow{gap:2px}
  .row .chev{color:#B3B9CF;display:flex;width:16px;flex:none}
  .row.off .bulle,.row.off .name,.row.off .amt{opacity:.5}
  .row.off .amt{text-decoration:line-through}
  .list .row.op+.row.op,.list .chips+.row.op{box-shadow:inset 0 1px 0 var(--rail)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px 70px}
  @media (max-width:560px){.chips{padding-left:16px}}
  .pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--b) 12%,#fff);color:var(--navy);font-size:.8rem;font-weight:600}
  .pchip svg{color:var(--b)}
  .pchip:hover{background:color-mix(in srgb,var(--b) 24%,#fff)}
  .grouphead{padding:16px 16px 4px;font-size:.76rem;letter-spacing:.02em}
  .oplist{display:flex;flex-direction:column}
  .row.op.mini{padding:8px 0;gap:12px}
  .row.op.mini:hover{background:none}
  .row.op.mini:hover .name{color:var(--cyan)}
  .oplist .row.op.mini+.row.op.mini{box-shadow:none}
  .deplayout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
  @media (min-width:1000px){.deplayout{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}.deplayout>.col:first-child{position:sticky;top:20px}}
  .segtabs{align-self:center;width:100%;max-width:340px;display:grid;grid-template-columns:1fr 1fr}
  .segtabs button{padding:10px 0}
  .anaring{display:flex;justify-content:center;padding:6px 0}
  .anaring .ring{width:200px;height:200px}
  .anaring .ring .c{gap:0}
  .legend2{display:flex;flex-direction:column;gap:2px}
  .legrow{display:flex;align-items:center;gap:12px;padding:10px 8px;width:100%;text-align:left;border-radius:16px}
  .legrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .legrow .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legrow b{white-space:nowrap}
  .legrow:not([disabled]):hover,.legrow.on{background:#F3F4FB}
  .legrow[disabled]{cursor:default;color:inherit}
  .legrow .chev{color:#B3B9CF;display:flex}
  .solde{display:flex;flex-direction:column;gap:2px;padding:4px 0}
  .solde-v{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  button.kpi:hover{background:#FAFAFF}
  .projcard .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .projcard .actions .btn{padding:11px 8px;font-size:.9rem;text-align:center;white-space:nowrap}
  .projcard .actions .btn:first-child{grid-column:1/-1}
  @media (min-width:600px){.projcard .actions{grid-template-columns:1.4fr 1fr 1fr}.projcard .actions .btn:first-child{grid-column:auto}}

<script>
const REV_TYPES={salaire:"Salaire net",pension:"Pension / aide famille",aide:"Aide (CAF, bourse)",autre:"Autre"};
const GROUPES={logement:"Logement",abonnements:"Abonnements",transport:"Transport",autre:"Autres charges"};
const DEFAULT={revenus:[],charges:[],enveloppes:[],depenses:[],projets:[]};
let S=structuredClone(DEFAULT), tab="mois", now=new Date(), cur={y:now.getFullYear(),m:now.getMonth()};
let saveT=null, pending=false, code=null, pinMsg="", offline=false, canal=null, differe=false;
const APPAREIL=Math.random().toString(36).slice(2);
const LS_KEY="budget-gautier";
const SUPABASE_URL="https://ubkcaufyyrqwwjpptrso.supabase.co";
const SUPABASE_KEY="sb_publishable_DBgF1on72HKlHod21iSLig_4-9izcWW";
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
// Point de départ du premier lancement : tes catégories, montants à remplir
const SEED={revenus:[{id:"r1",nom:"Salaire alternance",montant:0,type:"salaire"},{id:"r2",nom:"Aide parents",montant:0,type:"pension"},{id:"r3",nom:"CAF",montant:0,type:"aide"}],
 charges:[{id:"c1",nom:"Loyer",montant:0,groupe:"logement"},{id:"c2",nom:"Électricité",montant:0,groupe:"logement"},{id:"c3",nom:"Gaz",montant:0,groupe:"logement"},{id:"c4",nom:"Assurance habitation",montant:0,groupe:"logement"},{id:"c5",nom:"Logement Le Havre",montant:0,groupe:"logement"},{id:"c6",nom:"Claude",montant:0,groupe:"abonnements"},{id:"c7",nom:"Netflix",montant:0,groupe:"abonnements"},{id:"c8",nom:"Basic-Fit",montant:0,groupe:"abonnements"},{id:"c9",nom:"Location vélo",montant:0,groupe:"transport"}],
 enveloppes:[{id:"e1",nom:"Courses",budget:0},{id:"e2",nom:"Repas dehors",budget:0},{id:"e3",nom:"Sorties",budget:0},{id:"e4",nom:"Shopping",budget:0},{id:"e5",nom:"Imprévus",budget:0}],
 depenses:[],projets:[]};

const eur=n=>{n=Math.round((+n||0)*100)/100;return n.toLocaleString("fr-FR",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" €"};
const uid=()=>Math.random().toString(36).slice(2,10);
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mkey=(y,m)=>`${y}-${String(m+1).padStart(2,"0")}`;
const $=id=>document.getElementById(id);
const ICON={
  in:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  home:'<path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/>',
  cart:'<circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L21 8H6.6"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M16 13h2M3 9.5h18M6 6l9-2.5 1.5 2.5"/>'};
const ic=k=>`<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>`;

/* ---------- Stockage : Supabase protégé par un code ---------- */
// Le code n'est pas dans ce fichier. Supabase n'en garde qu'une empreinte (bcrypt) et bloque 15 min après 5 codes faux.
// Une fois le bon code saisi, il est retenu sur l'appareil : l'app s'ouvre ensuite directement.
function setSync(m,t){$("dot").className="dot "+(m==="db"?"ok":"local");$("synctxt").textContent=t}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r)S={...DEFAULT,...JSON.parse(r)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
const actifs=()=>S.projets.filter(p=>!p.termine);
const hasData=()=>S.revenus.length||S.charges.length||S.depenses.length||S.projets.length||S.enveloppes.length;
const MSG={code:"Code incorrect.",bloque:"Trop d'essais : accès bloqué 15 minutes."};
function oublierCode(){try{localStorage.removeItem("budget-code")}catch(e){}code=null}

function save(){
  saveLocal();
  if(!sb||!code)return;
  clearTimeout(saveT);pending=true;setSync("db","Enregistrement…");
  saveT=setTimeout(async()=>{
    try{
      const {data,error}=await sb.rpc("save_budget",{c:code,d:S});
      if(error)throw error;
      if(data!=="ok"){if(data==="code"){oublierCode();render()}throw new Error(data)}
      setSync("db","Synchronisé");
      try{canal?.send({type:"broadcast",event:"maj",payload:{de:APPAREIL}})}catch(e){}
    }catch(e){setSync("local","Non synchronisé, réessaie plus tard")}
    pending=false;
  },500);
}

async function loadRemote(silencieux){
  if(!sb||!code||pending)return null;
  if(document.querySelector(".sheet-bg")){differe=true;return null}
  if(!silencieux)setSync("db","Chargement…");
  const {data,error}=await sb.rpc("get_budget",{c:code});
  if(error){setSync("local","Erreur de synchro");return null}
  if(data&&data._erreur){
    if(data._erreur==="code")oublierCode();
    pinMsg=MSG[data._erreur]||"Accès refusé.";render();setSync("local",pinMsg);return data._erreur;
  }
  pinMsg="";
  S={...DEFAULT,...data};
  if(!hasData()){S=structuredClone(SEED);save()}
  saveLocal();render();setSync("db","Synchronisé");
  if(!banque||Date.now()-(banque.t||0)>10*60e3){(retourBanque().then(r=>r||syncBanque())).then(()=>{if(banque)banque.t=Date.now()})}
  return "ok";
}

/* ---------- Banque (Enable Banking via la fonction Supabase « banque ») ---------- */
let banque=null, banqueOcc=false;
async function appelBanque(action,extra={}){
  const {data,error}=await sb.functions.invoke("banque",{body:{action,c:code,...extra}});
  if(error){let m=error.message;try{const j=await error.context?.json?.();if(j?.erreur)m=j.erreur}catch(e){}throw new Error(m)}
  if(data?.erreur&&!data.connecte)throw new Error(data.erreur);
  return data;
}
const proche=(a,b,tol)=>Math.abs(a-b)<=tol;
// Reconnaître une charge fixe ou une entrée dans les opérations : par le nom, ou par le montant exact pour les sommes assez grosses
const nomDans=(nom,lib)=>norm(nom).length>=4&&lib.includes(norm(nom));
const estCharge=(c,m,lib)=>+c.montant>0&&(nomDans(c.nom,lib)||(+c.montant>=15&&proche(m,+c.montant,0.01)));
const estRevenu=(r,m,lib)=>+r.montant>0&&(nomDans(r.nom,lib)||(+r.montant>=100&&proche(m,+r.montant,r.montant*0.05)));
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
// Commerçant d'une opération : sert à retenir où tu l'as classée
function marchand(lib){
  let t=norm(lib).replace(/paiement par carte|prlv sepa|prelevement|vir(ement)?( sepa)?( inst)?( recu| emis)?|x\d{3,}|\b\d{2}\/\d{2}\b|[*]/g," ").replace(/\s+/g," ").trim();
  const m=t.split(" ").filter(Boolean);
  return (m[0]&&m[0].length<3?m.slice(0,2):m.slice(0,1)).join(" ");
}
const MOTS={
  "courses":/carrefour|leclerc|lidl|auchan|intermarche|monoprix|franprix|casino|super u|hyper u|aldi|picard|biocoop|netto|grand frais|spar|proxi|coccinelle|cora|match|epicerie|primeur/,
  "repas dehors":/restau|resto|mc ?do|mcdonald|burger|kfc|quick|tacos|kebab|pizza|sushi|boulang|paul |snack|cafe|coffee|starbucks|uber ?eats|deliveroo|just ?eat|crous|brioche|bangla|subway|o'tacos|five guys|domino/,
  "sorties":/bar |pub |cinema|pathe|ugc|cgr|bowling|concert|ticketmaster|fnac spectacle|discotheque|club/,
  "shopping":/amazon|zara|h&m|hm |decathlon|fnac|action|primark|uniqlo|sephora|kiabi|jules|celio|nike|adidas|zalando|shein|vinted|darty|boulanger/
};
function classer(d){
  const r=(S.regles||{})[marchand(d.note)]; if(r&&S.enveloppes.some(e=>e.id===r)){d.env=r;return}
  const lib=" "+norm(d.note)+" ";
  for(const e of S.enveloppes){const re=MOTS[norm(e.nom)];if(re&&re.test(lib)){d.env=e.id;return}}
}
// Range les opérations bancaires dans HAZEL sans jamais compter deux fois la même somme
function importerBanque(liste){
  if(S.bankVersion!==2){ // nettoyage : la 1re version importait chaque opération en double
    S.depenses=S.depenses.filter(d=>d.source!=="banque");S.depenses.forEach(d=>delete d.lienBanque);S.bankVus=[];S.bankVersion=2;
  }
  S.bankVus??=[]; const vus=new Set(S.bankVus); let n=0;
  for(const t of liste){
    const id="b:"+t.id; if(vus.has(id))continue; vus.add(id);
    const m=+t.amount, d={id,montant:m,sens:t.sens,env:"",note:t.label,date:t.booking_date,source:"banque"}, lib=norm(t.label);
    if(t.sens==="out"){
      const ch=S.charges.find(c=>estCharge(c,m,lib));
      if(ch){d.ignore="fixe";d.fixeId=ch.id;d.raison="Déjà compté dans Fixe : "+ch.nom}
    }else{
      const rv=S.revenus.find(r=>estRevenu(r,m,lib));
      if(rv){d.ignore="fixe";d.fixeId=rv.id;d.raison="Déjà compté dans les entrées : "+rv.nom}
    }
    if(!d.ignore){ // déjà saisi à la main ? même sens, même montant, à 3 jours près
      const dt=new Date(d.date).getTime();
      const man=S.depenses.find(x=>!x.source&&!x.lienBanque&&x.sens===d.sens&&proche(+x.montant,m,0.01)&&Math.abs(new Date(x.date).getTime()-dt)<=3*864e5);
      if(man){d.ignore="doublon";d.raison="Déjà saisie à la main le "+new Date(man.date+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});man.lienBanque=id}
    }
    if(!d.ignore&&d.sens==="out")classer(d);
    S.depenses.push(d);n++;
  }
  S.bankVus=[...vus].slice(-3000);
  return n;
}
// Paiements « à venir » : comptés tout de suite (comme le solde à venir de la banque), jamais enregistrés,
// ils sont remplacés par l'opération définitive quand la banque la comptabilise.
function enAttente(){
  if(!banque?.connecte||!banque.attente?.length)return [];
  return banque.attente.map(t=>{
    const d={id:"p:"+t.id,montant:+t.amount,sens:t.sens,env:"",note:t.label,date:t.booking_date,source:"attente"},m=+t.amount,lib=norm(t.label);
    const ch=t.sens==="out"?S.charges.find(c=>estCharge(c,m,lib)):null;
    if(ch){d.ignore="fixe";d.fixeId=ch.id;d.raison="Déjà compté dans Fixe : "+ch.nom}
    else{const dt=new Date(d.date).getTime();if(S.depenses.some(x=>!x.source&&x.sens===d.sens&&proche(+x.montant,m,0.01)&&Math.abs(new Date(x.date).getTime()-dt)<=3*864e5)){d.ignore="doublon";d.raison="Déjà saisie à la main"}}
    return d;
  });
}
async function syncBanque(action="sync",extra={}){
  if(!sb||!code||banqueOcc)return;
  banqueOcc=true;
  if(S.bankVersion!==2&&S.depenses.some(d=>d.source==="banque")){S.depenses=S.depenses.filter(d=>d.source!=="banque");S.depenses.forEach(d=>delete d.lienBanque);S.bankVus=[];S.bankVersion=2;render()}
  try{
    banque=await appelBanque(action,extra);
    if(banque.connecte&&banque.transactions?.length&&importerBanque(banque.transactions))save();
  }catch(e){banque={...(banque||{}),erreurAppel:e.message}}
  banqueOcc=false;render();
}
async function retourBanque(){ // retour de la validation dans « Ma Banque »
  const q=new URLSearchParams(location.search); if(!q.get("code")||!q.get("state"))return false;
  history.replaceState(null,"",location.pathname);
  await syncBanque("session",{code:q.get("code"),state:q.get("state")});
  tab="depenses";render();return true;
}
function vBanque(){
  if(!sb)return "";
  const b=banque;
  if(!b)return `<div class="card"><div class="cardhead"><h2>Compte bancaire</h2></div><div class="empty">Vérification…</div></div>`;
  const err=b.erreurAppel||b.erreur?`<p class="note" style="color:var(--down)">${esc(b.erreurAppel||b.erreur)}</p>`:"";
  if(!b.connecte)return `<div class="card"><div class="cardhead"><h2>Compte bancaire</h2></div>
    <p class="note">${b.expire?"L'accès à ta banque a expiré (la loi impose une nouvelle validation environ tous les 6 mois).":"Relie ton compte : tes opérations arrivent toutes seules dans HAZEL."}</p>${err}
    <button class="btn" data-act="lierBanque" style="align-self:flex-start">${b.expire?"Revalider l'accès":"Connecter ma banque"}</button></div>`;
  const soldes=Object.values(b.soldes||{});
  const jours=b.valid_until?Math.ceil((new Date(b.valid_until)-Date.now())/864e5):null;
  const aClasser=S.depenses.filter(d=>d.source==="banque"&&!d.ignore&&d.sens==="out"&&!d.env).length;
  return `<div class="card"><div class="cardhead"><span style="display:flex;align-items:center;gap:10px">${bulle("bank","#5B5CEB",34)}<h2>Compte bancaire</h2></span><button class="chip" data-act="syncBanque">${banqueOcc?"Synchro…":"Actualiser"}</button></div>
    ${soldes.map(x=>{const att=enAttente().filter(d=>!d.ignore||d.ignore!=="x").reduce((a,d)=>a+(d.sens==="in"?d.montant:-d.montant),0);
      const av=x.aVenir!=null?x.aVenir:Math.round((x.montant+att)*100)/100;
      return `<div class="solde"><span class="label">${esc(x.nom)}</span><span class="solde-v" style="${x.montant<0?"color:var(--down)":""}">${eur(x.montant)}</span>${Math.abs(av-x.montant)>0.004?`<span class="grey small">À venir : <b style="${av<0?"color:var(--down)":"color:var(--navy)"}">${eur(av)}</b></span>`:""}</div>`}).join("")||`<div class="empty">Solde indisponible pour l'instant.</div>`}
    <span class="grey small">${b.last_sync?"Mis à jour "+new Date(b.last_sync).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}${aClasser?` · <b style="color:var(--navy)">${aClasser} opération${aClasser>1?"s":""} à classer</b>`:""}</span>
    ${jours!==null&&jours<=14?`<p class="note" style="color:var(--down)">L'accès bancaire expire dans ${jours} jour${jours>1?"s":""}.</p><button class="btn" data-act="lierBanque" style="align-self:flex-start">Revalider l'accès</button>`:""}${err}
  </div>`;
}

async function connect(){
  try{localStorage.removeItem("budget-cle")}catch(e){}
  if(location.hash.includes("k="))history.replaceState(null,"",location.pathname);
  try{code=localStorage.getItem("budget-code")}catch(e){}
  loadLocal(); render();
  if(!sb){setSync("local","Mode local (Supabase indisponible)");return}
  if(code)loadRemote(); else setSync("local","Code requis");
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&code)loadRemote()});
  // Synchro en direct : un appareil qui enregistre envoie un simple signal (aucune donnée), les autres rechargent.
  try{
    canal=sb.channel("budget-maj").on("broadcast",{event:"maj"},m=>{if(m.payload?.de!==APPAREIL&&code)loadRemote(true)}).subscribe();
  }catch(e){}
  setInterval(()=>{if(document.visibilityState==="visible"&&code)loadRemote(true)},30000);
}

function vLogin(){
  return `<form class="login card" id="pinForm" novalidate>
    <h1>Code d'accès</h1>
    <p class="note">Une seule fois sur cet appareil, ensuite l'app s'ouvre directement.</p>
    <label class="field"><span class="label">Code</span><input id="f_pin" class="bigin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]*" maxlength="12" style="letter-spacing:.3em;text-align:center"></label>
    <button class="btn" type="submit" id="pinBtn">Entrer</button>
    ${pinMsg?`<p class="note" style="color:var(--down)">${esc(pinMsg)}</p>`:""}
    <button class="linkbtn" type="button" id="offline">Continuer sans synchro (sur cet appareil seulement)</button>
  </form>`;
}
function wireLogin(){
  setTimeout(()=>$("f_pin")?.focus(),50);
  $("pinForm").onsubmit=async e=>{e.preventDefault();
    const v=$("f_pin").value.replace(/\s/g,""); if(!v)return;
    $("pinBtn").disabled=true; code=v;
    const r=await loadRemote();
    if(r==="ok"){try{localStorage.setItem("budget-code",v)}catch(e){}}
    else{code=null;render();if(r===null)setSync("local","Erreur de connexion, réessaie")}
  };
  $("offline").onclick=()=>{offline=true;render();setSync("local","Sur cet appareil seulement")};
}
function accountSheet(){
  if(!code){offline=false;render();return}
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet"><h2 style="font-size:1.2rem">Accès</h2><p class="note">Cet appareil retient ton code. Pour ajouter un autre appareil, ouvre le site dessus et entre ton code.</p>
    <div class="actions-row"><button class="btn danger" id="forget">Verrouiller cet appareil</button><button class="btn plain" id="close">Fermer</button></div>

const svg=(k,w=18)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[k]||SVG.tag}</svg>`;
const bulle=(icon,couleur,t=40)=>`<span class="bulle" style="--b:${couleur};width:${t}px;height:${t}px">${svg(icon,Math.round(t*.45))}</span>`;
function envInfo(id){
  const i=S.enveloppes.findIndex(e=>e.id===id); if(i<0)return null;
  const e=S.enveloppes[i], n=norm(e.nom);
  const icon=/course|aliment|super/.test(n)?"cart":/repas|resto|manger|food/.test(n)?"food":/sortie|loisir|bar/.test(n)?"ticket":/shop|vetement|achat|habit/.test(n)?"bag":/imprevu|urgence/.test(n)?"alert":"tag";
  return {nom:e.nom,couleur:PAL[i%PAL.length],icon};
}
const GRP_IC={logement:["home","#4C7DF0"],abonnements:["repeat","#8B6CF0"],transport:["bike","#2DB3A3"],autre:["tag","#F2A33A"]};
// Libellé bancaire lisible : « PAIEMENT PAR CARTE X9352 GHYM LE HAVRE 21/10 » devient « Ghym » et « Carte · Le Havre »
function propre(lib){
  const brut=String(lib||""), N=brut.toUpperCase();
  const type=/PAIEMENT PAR CARTE|^CB /.test(N)?"Carte":/PRLV|PRELEVEMENT/.test(N)?"Prélèvement":/\bVIR/.test(N)?"Virement":/RETRAIT|DAB/.test(N)?"Retrait":"";
  let t=brut.replace(/PAIEMENT PAR CARTE|PRLV SEPA|PRELEVEMENT|VIREMENT( SEPA)?( INST)?( RECU| EMIS)?|\bVIR( SEPA)?( INST)?\b|RETRAIT( DAB)?|^CB\s/gi," ")
    .replace(/X\d{3,}/g," ").replace(/\b\d{2}\/\d{2}(\/\d{2,4})?\b/g," ").replace(/[*]/g," ").replace(/\.com\b/gi,"").replace(/\s+/g," ").trim();
  const m=t.toLowerCase().match(/\b(le havre|le havr|le hav|paris|caen|tours|rouen|lyon|lille|nantes|rennes|amsterda\w*|la riche|montlou\w*|luxembourg|dublin)\b/);
  let ville="";
  if(m&&m.index>1){ville=t.slice(m.index).trim();t=t.slice(0,m.index).trim()}
  const cap=x=>x.toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu,(a,b,c)=>b+c.toUpperCase());
  if(/^le hav/i.test(ville))ville="Le Havre"; else if(/^amsterda/i.test(ville))ville="Amsterdam"; else ville=cap(ville);
  return {titre:cap(t)||cap(brut)||"Opération",detail:[type,ville].filter(Boolean).join(" · ")};
}
// Une ligne d'opération, façon appli bancaire : bulle colorée, nom propre, catégorie, montant
function rowOp(t,{chips=false,mini=false}={}){
  const ei=envInfo(t.env), p=t.source?propre(t.note):{titre:t.note||ei?.nom||"Dépense",detail:""};
  let icon,col,sous;
  if(t.sens==="in"){icon="up";col="#2E9E6A";sous="Rentrée"}
  else if(t.fixeId){const ch=S.charges.find(c=>c.id===t.fixeId);[icon,col]=GRP_IC[ch?.groupe||"autre"]||GRP_IC.autre;sous=""}
  else if(ei){icon=ei.icon;col=ei.couleur;sous=ei.nom}
  else{icon="q";col="#9AA3BD";sous="À classer"}
  if(t.ignore)sous=t.raison||"Non compté";
  const detail=[sous,p.detail].filter(Boolean).join(" · ");
  const montant=`<span class="amt ${t.sens==="in"&&!t.ignore?"plus":""}">${t.sens==="in"?"+":"−"}${eur(+t.montant)}</span>`;
  const corps=`${bulle(icon,col,mini?30:40)}<span class="grow"><span class="name">${esc(p.titre)}${t.source==="attente"?'<span class="tag">À venir</span>':""}</span><span class="grey small">${esc(detail)}</span></span>${montant}`;
  const clic=t.source!=="attente";
  let html=clic?`<button class="row op${t.ignore?" off":""}${mini?" mini":""}" data-act="editDep" data-id="${t.id}">${corps}${mini?"":`<span class="chev">${svg("chev",16)}</span>`}</button>`
               :`<div class="row op${t.ignore?" off":""}${mini?" mini":""}">${corps}${mini?"":'<span class="chev"></span>'}</div>`;
  if(chips&&clic&&!t.ignore&&!t.env&&t.sens==="out"&&S.enveloppes.length)
    html+=`<div class="chips" role="group" aria-label="Classer">${S.enveloppes.map(e=>{const i=envInfo(e.id);return `<button class="pchip" data-act="cls" data-id="${t.id}|${e.id}" style="--b:${i.couleur}">${svg(i.icon,14)}${esc(e.nom)}</button>`}).join("")}</div>`;
  return html;
}

/* ---------- calculs ---------- */
function calc(y=cur.y,m=cur.m,upto=null){
  const k=mkey(y,m);
  const rev=sum(S.revenus,r=>r.montant);
  const fixe=sum(S.charges,c=>c.montant);
  // Argent déplacé vers les projets ce mois-ci : il sort du reste à vivre
  const projM=sum(S.projets.flatMap(p=>p.versements||[]).filter(v=>(v.date||"").startsWith(k)),v=>v.montant);
  let tous=S.depenses.filter(d=>(d.date||"").startsWith(k)).concat(enAttente().filter(d=>d.date.startsWith(k)));
  let txs=tous.filter(d=>!d.ignore);
  if(upto)txs=txs.filter(d=>+d.date.slice(8,10)<=upto);
  const dep=sum(txs.filter(d=>d.sens!=="in"),d=>d.montant);
  const extra=sum(txs.filter(d=>d.sens==="in"),d=>d.montant);
  const dispo=rev+extra-fixe-projM; let reste=dispo-dep;
  const dim=new Date(y,m+1,0).getDate();
  const isCur=y===now.getFullYear()&&m===now.getMonth();
  const isPast=new Date(y,m+1,1)<=new Date(now.getFullYear(),now.getMonth(),1);
  const jours=isCur?dim-now.getDate()+1:(isPast?0:dim);
  let ancre=null;
  if(isCur&&banque?.connecte&&Object.keys(banque.soldes||{}).length){
    const att=(banque.attente||[]).reduce((a,t)=>a+(t.sens==="in"?+t.amount:-t.amount),0);
    const solde=Object.values(banque.soldes).reduce((a,x)=>a+(x.aVenir!=null?+x.aVenir:+x.montant+att),0);
    const vus=new Set(tous.filter(d=>d.fixeId).map(d=>d.fixeId));
    const chargesAVenir=sum(S.charges.filter(c=>+c.montant>0&&!vus.has(c.id)),c=>c.montant);
    const entreesAttendues=sum(S.revenus.filter(r=>+r.montant>0&&!vus.has(r.id)),r=>r.montant);
    const reserve=sum(actifs(),p=>sum(p.versements||[],v=>v.montant));
    ancre={solde,chargesAVenir,entreesAttendues,reserve};
    reste=Math.round((solde-chargesAVenir+entreesAttendues-reserve)*100)/100;
  }
  return {k,rev,fixe,projM,dep,extra,dispo,reste,ancre,dim,jours,isCur,isPast,txs,tous,envBud:sum(S.enveloppes,e=>e.budget)};
}

function ring(segs,total){
  const R=74,C=2*Math.PI*R; let off=0, out="";
  segs.forEach(([v,col])=>{if(v<=0||total<=0)return;const len=Math.min(v/total,1-off/C)*C;if(len<=0)return;
    const gap=len>6?3:0;
    out+=`<circle cx="88" cy="88" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${Math.max(0.1,len-gap-6)} ${C}" stroke-dashoffset="${-(off+3)}"/>`;off+=len});
  return `<svg viewBox="0 0 176 176" aria-hidden="true"><circle cx="88" cy="88" r="${R}" fill="none" stroke="var(--rail)" stroke-width="12"/>${out}</svg>`;
}

function curve(c){
  const W=900,H=170,P={l:4,r:60,t:16,b:24};
  const lastDay=c.isCur?now.getDate():(c.isPast?c.dim:0);
  const daily=Array(c.dim+1).fill(0);
  c.txs.filter(d=>d.sens!=="in").forEach(d=>{daily[+d.date.slice(8,10)]+=+d.montant||0});
  const pts=[];let acc=0;for(let d=1;d<=lastDay;d++){acc+=daily[d];pts.push([d,acc])}
  const max=Math.max(acc,c.dispo>0?c.dispo:0,1);
  const X=d=>P.l+(d-1)/(c.dim-1)*(W-P.l-P.r), Y=v=>H-P.b-v/max*(H-P.t-P.b);
  const xy=pts.map(([d,v])=>[X(d),Y(v)]);
  let path="";
  if(xy.length===1)path=`M${xy[0][0]},${xy[0][1]}`;
  else if(xy.length>1){path=`M${xy[0][0]},${xy[0][1]}`;
    for(let i=0;i<xy.length-1;i++){const p0=xy[i-1]||xy[i],p1=xy[i],p2=xy[i+1],p3=xy[i+2]||p2;
      const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
      path+=` C${c1[0].toFixed(1)},${Math.min(H-P.b,c1[1]).toFixed(1)} ${c2[0].toFixed(1)},${Math.min(H-P.b,c2[1]).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}}
  const area=xy.length>1?`${path} L${xy[xy.length-1][0]},${H-P.b} L${xy[0][0]},${H-P.b} Z`:"";
  const end=xy[xy.length-1];
  const ideal=c.dispo>0?`<line x1="${X(1)}" y1="${Y(0)}" x2="${X(c.dim)}" y2="${Y(c.dispo)}" stroke="var(--grey)" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 5"/><text x="${X(c.dim)+8}" y="${Y(c.dispo)+4}" font-size="11" fill="var(--grey)">${eur(c.dispo)}</text>`:"";
  const ticks=[1,Math.round(c.dim/2),c.dim].map(d=>`<text x="${X(d)}" y="${H-6}" font-size="11" fill="var(--grey)" text-anchor="${d===1?"start":d===c.dim?"end":"middle"}">${d} ${new Date(cur.y,cur.m,1).toLocaleDateString("fr-FR",{month:"short"})}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses cumulées sur le mois">
    <defs><linearGradient id="halo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B5CEB" stop-opacity=".20"/><stop offset="1" stop-color="#5B5CEB" stop-opacity="0"/></linearGradient></defs>
    ${ideal}
    ${area?`<path d="${area}" fill="url(#halo)"/>`:""}
    ${path?`<path d="${path}" fill="none" stroke="var(--cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:""}
    ${end?`<circle cx="${end[0]}" cy="${end[1]}" r="5" fill="var(--card)" stroke="var(--cyan)" stroke-width="2.5"/><text x="${Math.min(end[0]+10,W-P.r+8)}" y="${end[1]-10}" font-size="12" font-weight="700" fill="var(--navy)">${eur(acc)}</text>`:""}
    ${ticks}
  </svg>`;
}

function vMois(){
  const c=calc(); const empty=!c.rev;
  const pj=c.jours>0?c.reste/c.jours:null;
  let status;
  if(empty)status=`<span class="pill info">À configurer : entre tes montants dans Fixe</span>`;
  else if(c.reste<0)status=`<span class="pill bad">Dépassé de ${eur(-c.reste)}</span>`;
  else if(c.jours&&c.dispo>0&&(c.reste/c.dispo)<(c.jours/c.dim)*0.8)status=`<span class="pill bad">Tu dépenses plus vite que le mois n'avance</span>`;
  else status=`<span class="pill ok">Dans le rythme</span>`;

  const pctDep=c.dispo>0?Math.round(c.dep/c.dispo*100):0;

    <div class="kpi">${ic("in")}<span class="label">Entrées du mois</span><span class="v">${eur(c.rev+c.extra)}</span><span class="var n">${S.revenus.length} source${S.revenus.length>1?"s":""}${c.extra?" + rentrées":""}</span></div>
    <div class="kpi">${ic("home")}<span class="label">Charges fixes</span><span class="v">${eur(c.fixe)}</span><span class="var n">${c.rev?Math.round(c.fixe/c.rev*100)+" % des entrées":"entrées à saisir"}</span></div>
    <div class="kpi">${ic("cart")}<span class="label">Dépensé ce mois</span><span class="v">${eur(c.dep)}</span><span class="var n">${c.dispo>0?pctDep+" % du budget pour vivre":"budget à définir"}</span></div>
  </div>

          ${c.ancre?`<div class="grey small">Calculé sur ton vrai compte : solde à venir ${eur(c.ancre.solde)}${c.ancre.chargesAVenir?` − charges pas encore prélevées ${eur(c.ancre.chargesAVenir)}`:""}${c.ancre.entreesAttendues?` + entrées attendues ${eur(c.ancre.entreesAttendues)}`:""}${c.ancre.reserve?` − mis de côté ${eur(c.ancre.reserve)}`:""}</div>`:""}
          ${status}
          <div class="legend"><span><i style="background:var(--c1)"></i>Fixe <b>${eur(c.fixe)}</b></span><span><i style="background:var(--c2)"></i>Projets <b>${eur(c.projM)}</b></span><span><i style="background:var(--c3)"></i>Dépensé <b>${eur(c.dep)}</b></span><span><i style="background:var(--rail)"></i>Libre <b>${eur(Math.max(0,c.reste))}</b></span></div>

    </div>
    <div class="card grow">
      <div class="cardhead"><h2>Enveloppes</h2><span class="label">${nonRep>=0?"Non réparti "+eur(nonRep):"Trop réparti de "+eur(-nonRep)}</span></div>

      <button class="add" data-act="addProj">+ Nouveau projet</button>

    <div class="card">
      ${head("Fixe chaque mois","fixe")}
      <div class="cbody">
        <div class="kv"><span class="name" style="display:flex;align-items:center;gap:10px">${bulle("up","#2E9E6A",30)}Entrées</span><span class="plus">+${eur(c.rev)}</span></div>
        <div class="kv"><span class="name" style="display:flex;align-items:center;gap:10px">${bulle("home","#4C7DF0",30)}Charges${(()=>{const v=S.charges.filter(x=>!+x.montant).length+S.revenus.filter(x=>!+x.montant).length;return v?`<span class="tag">${v} à remplir</span>`:""})()}</span><b>−${eur(c.fixe)}</b></div>
      </div>

    <div class="card grow">
      ${head("Dernières dépenses","depenses",`<span class="label">${c.txs.length} ce mois</span>`)}

    </div>

}

let ana="out", filtre=null;
function vAnalyse(c){
  let groupes=[];
  if(ana==="out"){
    const m=new Map();
    for(const d of c.txs.filter(d=>d.sens==="out")){
      const ei=envInfo(d.env), k=ei?d.env:"_";
      const g=m.get(k)||{k,nom:ei?ei.nom:"À classer",col:ei?ei.couleur:"#9AA3BD",icon:ei?ei.icon:"q",total:0,n:0};
      g.total+=+d.montant;g.n++;m.set(k,g);
    }
    groupes=[...m.values()];
  }else{
    S.revenus.filter(r=>+r.montant>0).forEach((r,i)=>groupes.push({k:"r"+r.id,nom:r.nom,col:["#2E9E6A","#3CB371","#2DB3A3","#5AA9E6"][i%4],icon:"up",total:+r.montant,n:1,fixe:true}));
    const m=new Map();
    for(const d of c.txs.filter(d=>d.sens==="in")){const t=d.source?propre(d.note).titre:(d.note||"Rentrée");const g=m.get(t)||{k:"x"+t,nom:t,col:"#F2A33A",icon:"up",total:0,n:0};g.total+=+d.montant;g.n++;m.set(t,g)}
    groupes.push(...m.values());
  }
  groupes.sort((x,y)=>y.total-x.total);
  const tot=sum(groupes,g=>g.total);
  const legende=groupes.map(g=>`<button class="legrow${filtre===g.k?" on":""}" ${ana==="out"?`data-act="filtre" data-id="${esc(g.k)}"`:"disabled"}>${bulle(g.icon,g.col)}<span class="grow"><span class="name">${esc(g.nom)}</span><span class="grey small">${tot?Math.round(g.total/tot*100):0} % · ${g.fixe?"chaque mois":g.n+" opération"+(g.n>1?"s":"")}</span></span><b>${eur(g.total)}</b>${ana==="out"?`<span class="chev">${svg("chev",16)}</span>`:""}</button>`).join("");
  return `<div class="card">
    <div class="seg segtabs" role="tablist"><button aria-pressed="${ana==="out"}" data-act="ana" data-id="out">Sorties</button><button aria-pressed="${ana==="in"}" data-act="ana" data-id="in">Entrées</button></div>
    <div class="anaring"><div class="ring">${ring(groupes.map(g=>[g.total,g.col]),Math.max(tot,1))}<div class="c"><b style="font-size:1.35rem">${eur(tot)}</b><span class="label">${ana==="out"?"Dépenses":"Entrées"}</span></div></div></div>
    ${groupes.length?`<div class="legend2">${legende}</div>`:`<div class="empty" style="text-align:center">Rien ce mois-ci.</div>`}
  </div>`;
}
function vDep(){
  const c=calc();
  let ops=[...c.tous];
  if(filtre)ops=ops.filter(d=>filtre==="_"?(!envInfo(d.env)&&d.sens==="out"&&!d.ignore):d.env===filtre);
  ops.sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  const byDay={}; ops.forEach(t=>(byDay[t.date]??=[]).push(t));
  const jours=Object.keys(byDay).map(d=>{
    const lab=new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    return `<div class="grouphead"><span style="text-transform:capitalize">${lab}</span><span>${eur(sum(byDay[d].filter(t=>t.sens!=="in"&&!t.ignore),t=>t.montant))}</span></div>`+byDay[d].map(t=>rowOp(t,{chips:true})).join("");
  }).join("");
  const nomFiltre=filtre==="_"?"À classer":envInfo(filtre)?.nom;
  return `<div class="deplayout">
    <div class="col">${vBanque()}${vAnalyse(c)}</div>
    <div class="col">
      <div class="sechead"><span class="t">${nomFiltre?esc(nomFiltre):"Opérations"}</span>${filtre?`<button class="chip" data-act="filtre" data-id="${esc(filtre)}">Tout voir</button>`:`<b>${eur(c.dep)}</b>`}</div>
      ${ops.length?`<div class="list">${jours}</div>`:`<div class="list"><div class="empty">Rien ici ce mois-ci. Le bouton <b>Dépense</b> ajoute une dépense en espèces.</div></div>`}
      <p class="note">Les opérations barrées sont déjà comptées ailleurs (charges fixes, entrées, saisie manuelle).</p>
    </div>
  </div>`;
}

function vFixe(){
  const rev=sum(S.revenus,r=>r.montant), fixe=sum(S.charges,c=>c.montant);
  const revRows=S.revenus.map(r=>`<button class="row" data-act="editRev" data-id="${r.id}">${bulle("up","#2E9E6A")}<div class="grow"><span class="name">${esc(r.nom)}</span><span class="grey small">${REV_TYPES[r.type]||"Autre"}</span></div><span class="amt ${+r.montant?"plus":"grey"}">${+r.montant?"+"+eur(+r.montant):"à remplir"}</span></button>`).join("");
  const groups=Object.keys(GROUPES).map(g=>{
    const items=S.charges.filter(c=>(c.groupe||"autre")===g); if(!items.length)return "";
    return `<div class="grouphead"><span>${GROUPES[g]}</span><span>${eur(sum(items,c=>c.montant))}</span></div>`+
      items.map(c=>`<button class="row" data-act="editCh" data-id="${c.id}">${bulle(...(GRP_IC[c.groupe||"autre"]||GRP_IC.autre))}<div class="grow"><span class="name">${esc(c.nom)}</span></div><span class="amt ${!+c.montant?"grey":""}">${+c.montant?"−"+eur(+c.montant):"à remplir"}</span></button>`).join("")}).join("");
  return `
    <div class="sechead"><span class="t">Ce qui rentre chaque mois</span><b class="plus">+${eur(rev)}</b></div>
    ${S.revenus.length?`<div class="list">${revRows}</div>`:`<div class="list"><div class="empty">Ajoute ton salaire net, l'aide de tes parents, la CAF…</div></div>`}
    <button class="add" data-act="addRev">+ Ajouter une entrée</button>
    <div class="sechead"><span class="t">Charges fixes</span><b>−${eur(fixe)}</b></div>
    ${S.charges.length?`<div class="list">${groups}</div>`:`<div class="list"><div class="empty">Loyer, électricité, assurance, abonnements…</div></div>`}
    <button class="add" data-act="addCh">+ Ajouter une charge fixe</button>
    <p class="note">Une charge payée par trimestre ou par an ? Divise-la (ex. assurance 120 €/an = 10 €/mois) pour qu'elle ne te surprenne pas.</p>`;
}

function vProj(){
  const cards=actifs().map(p=>{
    const pc=p.cible>0?Math.min(1,(+p.epargne||0)/p.cible):0, done=pc>=1;
    const mois=!done&&+p.mensuel>0?Math.ceil((p.cible-(+p.epargne||0))/p.mensuel):null;
    return `<div class="card projcard">
      <div class="line"><span class="name" style="font-size:1.05rem;display:flex;align-items:center;gap:10px">${bulle("target",PAL[(S.projets.indexOf(p)+1)%PAL.length],36)}${esc(p.nom)}</span><span class="sub">${Math.round(pc*100)} %</span></div>
      <div class="line"><span style="font-size:1.5rem;font-weight:800;letter-spacing:-.02em">${eur(+p.epargne||0)} <span class="grey" style="font-size:1rem;font-weight:500">/ ${eur(+p.cible||0)}</span></span></div>
      <div class="bar"><span style="width:${(pc*100).toFixed(1)}%"></span></div>
      <span class="grey small">${done?"Objectif atteint : tu peux l'acheter":mois?`${eur(+p.mensuel)} par mois, encore ${mois} mois`:"Aucun objectif mensuel"}</span>
      <div class="actions">
        ${done?`<button class="btn" data-act="doneProj" data-id="${p.id}">C'est acheté</button>`:`<button class="btn" data-act="fundProj" data-id="${p.id}">Mettre de côté</button>`}
        ${+p.epargne>0?`<button class="btn plain" data-act="takeProj" data-id="${p.id}">Retirer</button>`:""}
        <button class="btn plain" data-act="editProj" data-id="${p.id}">Modifier</button>
      </div>
    </div>`}).join("");
  const finis=S.projets.filter(p=>p.termine);
  return `
    <div class="sechead"><span class="t">Projets</span><b>${eur(sum(actifs(),p=>p.epargne))} de côté</b></div>
    <p class="note">Mettre de côté retire l'argent de ton reste à vivre ; Retirer le lui rend.</p>
    ${cards||`<div class="card"><div class="empty">Aucun projet en cours. Exemple : une montre à 400 €, 50 € par mois.</div></div>`}
    <button class="add" data-act="addProj">+ Nouveau projet</button>
    ${finis.length?`<div class="sechead"><span class="t" style="font-size:1rem">Terminés</span></div><div class="list">${finis.map(p=>`<div class="row"><div class="grow"><span class="name">${esc(p.nom)}</span><span class="grey small">Acheté le ${new Date((p.dateFin||today())+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</span></div><span class="amt">${eur(+p.epargne||0)}</span></div>`).join("")}</div>`:""}`;
}

/* ---------- feuille d'édition ---------- */
function sheet(title,fields,onSave,onDelete,delInfo){
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<form class="sheet" novalidate><h2 style="font-size:1.2rem">${title}</h2>${fields.map(f=>{
    if(f.type==="seg")return `<div class="field"><span class="label">${f.label}</span><div class="seg" data-name="${f.name}">${Object.entries(f.options).map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${k===f.value}">${l}</button>`).join("")}</div></div>`;
    if(f.type==="select")return `<label class="field"><span class="label">${f.label}</span><select id="f_${f.name}" name="${f.name}">${Object.entries(f.options).map(([k,l])=>`<option value="${esc(k)}" ${k===f.value?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
    return `<label class="field"><span class="label">${f.label}</span><input id="f_${f.name}" name="${f.name}" class="${f.big?"bigin":""}" type="${f.type||"text"}" ${f.type==="number"?'inputmode="decimal" step="0.01" min="0"':""} value="${esc(f.value??"")}" placeholder="${esc(f.ph||"")}"></label>`}).join("")}
    <p id="err" style="margin:0;color:var(--down);font-size:.88rem" hidden></p>
    <div class="actions-row"><div>${onDelete?`<button type="button" class="btn danger" id="del">Supprimer</button>`:""}</div><div style="display:flex;gap:8px"><button type="button" class="btn plain" id="cancel">Annuler</button><button class="btn" type="submit">Enregistrer</button></div></div></form>`;
  document.body.appendChild(bg);
  const form=bg.querySelector("form"), close=()=>{bg.remove();if(differe){differe=false;setTimeout(()=>loadRemote(true),600)}};
  bg.querySelectorAll(".seg").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));}));
  bg.addEventListener("click",e=>{if(e.target===bg)close()});
  $("cancel").onclick=close;
  let armed=false;
  if(onDelete)$("del").onclick=()=>{if(!armed){armed=true;$("del").textContent=delInfo||"Confirmer la suppression";return}onDelete();save();render();close()};
  form.onsubmit=e=>{e.preventDefault();const v={};
    fields.forEach(f=>{if(f.type==="seg")v[f.name]=form.querySelector(`[data-name="${f.name}"] [aria-pressed="true"]`)?.dataset.v;else{const x=form.elements[f.name].value;v[f.name]=f.type==="number"?parseFloat(String(x).replace(",","."))||0:x.trim()}});
    const err=onSave(v); if(err){$("err").textContent=err;$("err").hidden=false;return}
    save();render();close()};
  setTimeout(()=>form.querySelector("input")?.focus(),50);
}
const today=()=>{const d=new Date();return cur.y===d.getFullYear()&&cur.m===d.getMonth()?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`:mkey(cur.y,cur.m)+"-01"};
const envOpts=()=>Object.fromEntries(S.enveloppes.map(e=>[e.id,e.nom]).concat([["","Sans enveloppe"]]));

function act(a,id){
  const find=(arr)=>S[arr].find(x=>x.id===id), rm=(arr)=>()=>{S[arr]=S[arr].filter(x=>x.id!==id)};
  if(a==="go"){tab=id;render();window.scrollTo(0,0);return}
  if(a==="addRev"||a==="editRev"){const r=a==="editRev"?find("revenus"):{};
    sheet(r.id?"Modifier l'entrée":"Nouvelle entrée mensuelle",[
      {name:"nom",label:"Nom",value:r.nom,ph:"Salaire alternance"},
      {name:"montant",label:"Montant par mois (€)",type:"number",big:1,value:r.montant},
      {name:"type",label:"Type",type:"seg",options:REV_TYPES,value:r.type||"salaire"}],
      v=>{if(!v.nom)return "Donne un nom.";Object.assign(r,v);if(!r.id){r.id=uid();S.revenus.push(r)}},r.id&&rm("revenus"))}
  if(a==="addCh"||a==="editCh"){const c=a==="editCh"?find("charges"):{};
    sheet(c.id?"Modifier la charge":"Nouvelle charge fixe",[
      {name:"nom",label:"Nom",value:c.nom,ph:"Loyer"},
      {name:"montant",label:"Montant par mois (€)",type:"number",big:1,value:c.montant},
      {name:"groupe",label:"Catégorie",type:"seg",options:GROUPES,value:c.groupe||"logement"}],
      v=>{if(!v.nom)return "Donne un nom.";Object.assign(c,v);if(!c.id){c.id=uid();S.charges.push(c)}},c.id&&rm("charges"))}
  if(a==="addEnv"||a==="editEnv"){const e=a==="editEnv"?find("enveloppes"):{};
    sheet(e.id?"Modifier l'enveloppe":"Nouvelle enveloppe",[
      {name:"nom",label:"Nom",value:e.nom,ph:"Courses"},
      {name:"budget",label:"Budget par mois (€)",type:"number",big:1,value:e.budget}],
      v=>{if(!v.nom)return "Donne un nom.";Object.assign(e,v);if(!e.id){e.id=uid();S.enveloppes.push(e)}},e.id&&rm("enveloppes"))}
  if(a==="addDep"||a==="editDep"){const d=a==="editDep"?find("depenses"):{};
    sheet(d.id?"Modifier":"Nouvelle dépense",[
      {name:"montant",label:"Montant (€)",type:"number",big:1,value:d.montant},
      {name:"sens",label:"Sens",type:"seg",options:{out:"Dépense",in:"Rentrée"},value:d.sens||"out"},
      {name:"env",label:"Enveloppe",type:"select",options:envOpts(),value:d.env??S.enveloppes[0]?.id??""},
      {name:"note",label:"Note (facultatif)",value:d.note,ph:"Carrefour, resto…"},
      {name:"date",label:"Date",type:"date",value:d.date||today()},
      ...(d.source==="banque"?[{name:"compter",label:"Compter dans le budget",type:"seg",options:{oui:"Oui",non:"Non (déjà dans Fixe, virement entre mes comptes…)"},value:d.ignore?"non":"oui"}]:[])],
      v=>{if(!(v.montant>0))return "Entre un montant.";if(!v.date)return "Choisis une date.";
        if(d.source==="banque"){if(v.compter==="non"){d.ignore=d.ignore||"manuel";d.raison=d.raison||"Non compté"}else{delete d.ignore;delete d.raison}delete v.compter;
          if(v.env&&v.env!==d.env){const m=marchand(d.note);if(m){(S.regles??={})[m]=v.env;S.depenses.forEach(x=>{if(x.source==="banque"&&!x.env&&x!==d&&marchand(x.note)===m)x.env=v.env})}}}
        Object.assign(d,v);if(!d.id){d.id=uid();S.depenses.push(d)}},d.id&&rm("depenses"))}
  if(a==="addProj"||a==="editProj"){const p=a==="editProj"?find("projets"):{};
    sheet(p.id?"Modifier le projet":"Nouveau projet",[
      {name:"nom",label:"Nom",value:p.nom,ph:"Montre, voyage, permis…"},
      {name:"cible",label:"Coût total (€)",type:"number",big:1,value:p.cible},
      ...(p.id?[]:[{name:"epargne",label:"Déjà épargné avant (€), non retiré du reste à vivre",type:"number",value:0}]),
      {name:"mensuel",label:"Objectif par mois (€), facultatif",type:"number",value:p.mensuel??0}],
      v=>{if(!v.nom)return "Donne un nom.";if(!(v.cible>0))return "Entre le coût total.";Object.assign(p,v);if(!p.id){p.id=uid();S.projets.push(p)}},
      p.id&&(()=>{ // l'argent du projet revient dans le reste à vivre
        const d=today(), ce=sum((p.versements||[]).filter(x=>(x.date||"").startsWith(d.slice(0,7))),x=>x.montant);
        const retour=Math.round(((+p.epargne||0)-ce)*100)/100; // les versements du mois reviennent d'eux-mêmes en supprimant le projet
        if(retour>0)S.depenses.push({id:uid(),montant:retour,sens:"in",env:"",note:"Retour du projet "+p.nom,date:d});
        rm("projets")();
      }),
      p.id&&+p.epargne>0?`Confirmer : ${eur(+p.epargne)} reviennent dans ton reste à vivre`:null)}
  if(a==="cls"){const [did,eid]=id.split("|");const d=S.depenses.find(x=>x.id===did);
    if(d){d.env=eid;const m=marchand(d.note);if(m){(S.regles??={})[m]=eid;S.depenses.forEach(x=>{if(x.source==="banque"&&!x.env&&marchand(x.note)===m)x.env=eid})}save();render()}return}
  if(a==="ana"){ana=id;filtre=null;render();return}
  if(a==="filtre"){filtre=filtre===id?null:id;render();return}
  if(a==="syncBanque"){banque&&(banque.t=0);syncBanque();render();return}
  if(a==="lierBanque"){
    const bg=document.createElement("div");bg.className="sheet-bg";
    bg.innerHTML=`<div class="sheet"><h2 style="font-size:1.2rem">Connecter ma banque</h2><p class="note">Choisis ta banque (pour le Crédit Agricole, ta caisse régionale), puis valide dans l'appli de ta banque. Tu reviens ensuite ici automatiquement.</p>
      <label class="field"><span class="label">Rechercher</span><input id="f_bq" placeholder="agricole" value="agricole de normandie"></label>
      <label class="field"><span class="label">Banque</span><select id="f_bqs"><option>Chargement…</option></select></label>
      <p id="bqErr" class="note" style="color:var(--down)" hidden></p>
      <div class="actions-row"><button class="btn plain" id="bqClose">Annuler</button><button class="btn" id="bqGo" disabled>Continuer vers ma banque</button></div></div>`;
    document.body.appendChild(bg);
    const err=t=>{bg.querySelector("#bqErr").textContent=t;bg.querySelector("#bqErr").hidden=false};
    bg.querySelector("#bqClose").onclick=()=>bg.remove();
    let liste=[];const remplir=()=>{const f=norm(bg.querySelector("#f_bq").value);const l=liste.filter(n=>norm(n).includes(f));bg.querySelector("#f_bqs").innerHTML=l.map(n=>`<option>${esc(n)}</option>`).join("")||"<option value=''>Aucune banque trouvée</option>";bg.querySelector("#bqGo").disabled=!l.length};
    bg.querySelector("#f_bq").oninput=remplir;
    appelBanque("banques").then(r=>{liste=r.banques||[];remplir()}).catch(e=>err(e.message));
    bg.querySelector("#bqGo").onclick=async()=>{bg.querySelector("#bqGo").disabled=true;
      try{const r=await appelBanque("connecter",{banque:bg.querySelector("#f_bqs").value});location.href=r.url}catch(e){err(e.message);bg.querySelector("#bqGo").disabled=false}};
    return}
  if(a==="takeProj"){const p=find("projets");
    sheet(`Retirer de ${esc(p.nom)}`,[{name:"m",label:`Montant (€), rendu à ton reste à vivre (max ${eur(+p.epargne||0)})`,type:"number",big:1,value:""}],
      v=>{if(!(v.m>0))return "Entre un montant.";if(v.m>(+p.epargne||0)+0.001)return `Le projet ne contient que ${eur(+p.epargne||0)}.`;
        p.epargne=Math.round(((+p.epargne||0)-v.m)*100)/100;(p.versements??=[]).push({date:today(),montant:-v.m})});return}
  if(a==="doneProj"){const p=find("projets");
    sheet(`${esc(p.nom)} : c'est acheté ?`,[],()=>{p.termine=true;p.dateFin=today()});
    const n=document.querySelector(".sheet h2");n.insertAdjacentHTML("afterend",`<p class="note">Les ${eur(+p.epargne||0)} mis de côté ont servi à l'achat : ils ne reviennent pas dans ton reste à vivre, et l'achat n'est pas compté une deuxième fois en dépense.</p>`);return}
  if(a==="fundProj"){const p=find("projets");
    sheet(`Mettre de côté pour ${esc(p.nom)}`,[{name:"m",label:"Montant (€), retiré de ton reste à vivre",type:"number",big:1,value:p.mensuel||""}],
      v=>{if(!(v.m>0))return "Entre un montant.";const r=calc().reste;if(v.m>r+0.001)return `Il ne te reste que ${eur(Math.max(0,r))} ce mois-ci.`;p.epargne=Math.round(((+p.epargne||0)+v.m)*100)/100;(p.versements??=[]).push({date:today(),montant:v.m})})}
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
$("prev").onclick=()=>{cur.m--;if(cur.m<0){cur.m=11;cur.y--}render()};
$("next").onclick=()=>{cur.m++;if(cur.m>11){cur.m=0;cur.y++}render()};
$("fab").onclick=()=>act("addDep");
$("sync").onclick=accountSheet;
connect();
</script>

</body>
</html>
