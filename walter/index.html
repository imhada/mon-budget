<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>W.A.L.T.E.R</title>
  <meta name="apple-mobile-web-app-title" content="W.A.L.T.E.R">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F7F8FA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
  :root{
    --navy:#0B1F3A; --bg:#F7F8FA; --card:#FFFFFF; --cyan:#00A8C6; --cyan-soft:#E3F6FA; --cyan-mid:#9ADCE9;
    --grey:#6B7280; --rail:#EEF1F5; --up:#16A34A; --up-soft:#E7F6EC; --down:#DC2626; --down-soft:#FCE9E9;
    --shadow:0 1px 2px rgba(11,31,58,.04),0 8px 24px rgba(11,31,58,.07);
    --shadow-lg:0 2px 6px rgba(11,31,58,.06),0 18px 40px rgba(11,31,58,.14);
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --r:10px; --navw:76px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);color:var(--navy);margin:0;padding:0}
  body{font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
    padding-top:max(16px,env(safe-area-inset-top,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:104px}
  @media (min-width:900px){body{padding-left:calc(var(--navw) + max(32px,env(safe-area-inset-left,0px)));padding-right:max(32px,env(safe-area-inset-right,0px));padding-top:28px;padding-bottom:48px}}
  .wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  main{display:flex;flex-direction:column;gap:20px}
  main.narrow{max-width:780px;width:100%;margin:0 auto}
  h1,h2{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  h1{font-size:1.5rem}
  h2{font-size:1.02rem}
  .label{font-size:.78rem;color:var(--grey);font-weight:500}
  .grey{color:var(--grey)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .deskonly{display:none!important}
  @media (min-width:900px){.deskonly{display:flex!important}.mobonly{display:none!important}}
  @media (max-width:599px){#synctxt{display:none}.sync{padding:0;width:36px;height:36px;justify-content:center}.top{flex-wrap:nowrap}}

  /* En-tête */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .top-l{display:flex;flex-direction:column;gap:2px;min-width:0}
  .top-r{display:flex;align-items:center;gap:8px}
  .sync{font-size:.78rem;color:var(--grey);display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);padding:6px 10px;border-radius:999px;min-height:32px}
  .sync:hover{background:var(--cyan-soft)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--grey)}
  .dot.ok{background:var(--up)} .dot.local{background:var(--cyan)}
  .iconbtn{background:var(--card);box-shadow:var(--shadow);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;color:var(--navy)}
  .iconbtn:hover{background:var(--cyan-soft)}

  /* Cartes et boutons */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .chip{background:var(--cyan-soft);color:var(--navy);font-weight:600;font-size:.84rem;padding:8px 12px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:36px}
  .chip:hover{background:var(--cyan-mid)}
  .btn{background:var(--cyan);color:var(--navy);font-weight:700;border-radius:8px;padding:11px 16px;min-height:44px}
  .btn:hover{filter:brightness(1.05)}
  .btn.plain{background:var(--rail);color:var(--navy);font-weight:600}
  .btn.danger{background:var(--down-soft);color:var(--down);font-weight:600}
  .btn.soft{background:var(--cyan-soft);font-weight:600}
  .empty{color:var(--grey);font-size:.9rem;padding:4px 0;margin:0}
  .note{font-size:.86rem;color:var(--grey);max-width:65ch;margin:0}
  .bar{height:6px;border-radius:3px;background:var(--rail);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:3px;background:var(--cyan)}
  .bar.full>span{background:var(--up)}
  @media (prefers-reduced-motion:no-preference){.bar>span{transition:width .4s ease}}

  /* Indicateurs */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  @media (max-width:899px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
  .kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .kpi .v{display:flex;align-items:baseline;gap:5px;min-width:0}
  .kpi .v b{font-size:clamp(1.15rem,2vw,1.4rem);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .kpi .v span{font-size:.78rem;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .dash{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
  .col{display:flex;flex-direction:column;gap:20px;min-width:0}
  @media (min-width:900px){.dash{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;align-items:stretch}.col{gap:24px}}

  /* Séance du jour */
  .hero{background:var(--navy);color:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px}
  .hero .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem}
  .hero .meta .k{font-weight:600;color:var(--cyan-mid)}
  .hero .meta .s{color:#C9D3E0}
  .hero b.t{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;display:block}
  .hero .sub{font-size:.85rem;color:#C9D3E0}
  .hero .acts{display:flex;gap:8px}
  .hero .acts .btn{flex:1}
  .hero .ghost{background:rgba(255,255,255,.12);color:#fff;font-weight:600;border-radius:8px;padding:11px 14px;min-height:44px}
  .hero .ghost:hover{background:rgba(255,255,255,.2)}
  .pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.8rem;font-weight:600}
  .pill.ok{background:var(--up-soft);color:var(--up)}

  /* Journée */
  .tl{display:grid;grid-template-columns:50px 14px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:9px 0}
  .tl+.tl{box-shadow:inset 0 1px 0 var(--rail)}
  .tl .h{font-size:.82rem;font-weight:600;color:var(--grey)}
  .tl .d{width:10px;height:10px;border-radius:50%;background:var(--rail);justify-self:center}
  .tl .d.done{background:var(--up)} .tl .d.now{background:var(--cyan)}
  .tl .n{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl .s{font-size:.78rem;color:var(--grey)}
  .chk{width:36px;height:36px;border-radius:8px;background:var(--rail);display:grid;place-items:center;color:var(--grey)}
  .chk:hover{background:var(--cyan-soft)}
  .chk.on{background:var(--up-soft);color:var(--up)}

  /* Semaine */
  .week{display:flex;flex-direction:column;gap:8px}
  .day{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:center;min-height:60px}
  .day.today{box-shadow:0 0 0 2px var(--cyan),var(--shadow)}
  .day.over{background:var(--cyan-soft)}
  .day .hit{position:absolute;inset:0;border-radius:var(--r)}
  .day .hit:hover{background:rgba(0,168,198,.05)}
  .dn{display:flex;flex-direction:column;align-items:center;line-height:1.1;pointer-events:none}
  .dn small{font-size:.7rem;color:var(--grey);font-weight:600;text-transform:uppercase}
  .dn b{font-size:1.2rem;font-weight:800}
  .evs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
  .ev{font-size:.8rem;font-weight:600;border-radius:8px;padding:6px 10px;line-height:1.25;pointer-events:none}
  .ev.s{background:var(--cyan);color:var(--navy);position:relative;z-index:1;pointer-events:auto;cursor:grab;text-align:left}
  .ev.s.fait{background:var(--up-soft);color:var(--up)}
  .ev.o{background:var(--rail);color:var(--grey);font-weight:500}
  .ev.r{background:var(--cyan-soft);font-weight:500}
  .ev.rl{background:var(--bg);font-weight:500;display:none}
  @media (min-width:900px){
    .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
    .day{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 8px;min-height:180px;background:var(--bg);box-shadow:none}
    .day.today{background:var(--cyan-soft);box-shadow:inset 0 0 0 2px var(--cyan)}
    main.planning .day{background:var(--card);box-shadow:var(--shadow);min-height:300px}
    main.planning .day.today{box-shadow:0 0 0 2px var(--cyan),var(--shadow)}
    .dn{align-items:flex-start}
    .evs{flex-direction:column;align-items:stretch}
    main.planning .ev.r{display:none}
    main.planning .ev.rl{display:block}
    .ev.r{align-self:flex-start}
  }
  .seg{display:flex;gap:6px;background:var(--card);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
  .seg button{flex:1;border-radius:8px;padding:8px 10px;font-size:.9rem;font-weight:500;min-height:38px}
  .seg button[aria-pressed="true"]{background:var(--cyan);color:var(--navy);font-weight:700}
  .wknav{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wknav b{font-weight:700}
  .info{background:var(--cyan-soft);border-radius:10px;padding:12px 14px;font-size:.86rem}

  /* Séances */
  .ex{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:9px 0}
  .ex+.ex{box-shadow:inset 0 1px 0 var(--rail)}
  .ex .n{font-weight:600;font-size:.92rem}
  .ex .s{font-size:.78rem;color:var(--grey)}
  .ex .s.up{color:var(--up);font-weight:600}
  .sets{font-size:.82rem;font-weight:700;background:var(--bg);border-radius:8px;padding:6px 10px;white-space:nowrap}
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  @media (max-width:420px){.sgrid{grid-template-columns:minmax(0,1fr)}}
  .acts{display:flex;gap:8px;flex-wrap:wrap}

  /* Cuisine */
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:8px;padding:0 12px;box-shadow:var(--shadow)}
  .search input{flex:1;border:0;background:none;font:inherit;color:var(--navy);padding:12px 0;min-width:0;outline:none}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pills button{background:var(--card);border-radius:8px;padding:7px 12px;font-size:.85rem;font-weight:500;min-height:36px;box-shadow:var(--shadow)}
  .pills button[aria-pressed="true"]{background:var(--cyan);color:var(--navy);font-weight:700}
  .plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .plat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .card .plat{background:var(--bg);box-shadow:none}
  .plat .t{font-size:.7rem;font-weight:600;color:var(--grey);text-transform:uppercase;letter-spacing:.03em}
  .plat .n{font-weight:700;font-size:.9rem;line-height:1.3;flex:1}
  .plat .m{display:flex;gap:6px;flex-wrap:wrap}
  .plat .m span{font-size:.75rem;font-weight:600;background:var(--bg);border-radius:6px;padding:3px 7px}
  .card .plat .m span{background:var(--card)}
  .plat .m span.p{background:var(--cyan-soft)}
  .plat .b{display:flex;gap:6px}
  .plat .b button{flex:1;background:var(--cyan-soft);font-weight:600;font-size:.82rem;border-radius:8px;padding:8px 10px;min-height:36px}
  .plat .b button:hover{background:var(--cyan-mid)}
  .plat .b button.ed{flex:0 0 36px;background:var(--rail);display:grid;place-items:center;padding:0}

  /* Navigation */
  .nav{position:fixed;z-index:5;background:var(--card);box-shadow:var(--shadow)}
  .nav .items{display:flex;gap:6px}
  .navbtn{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--grey);font-size:.68rem;font-weight:600;min-width:62px}
  .navbtn .sq{width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
  .navbtn svg{width:22px;height:22px}
  .navbtn[aria-selected="true"]{color:var(--navy)}
  .navbtn[aria-selected="true"] .sq{background:var(--cyan)}
  .navbtn:hover .sq{background:var(--cyan-soft)}
  .navbtn[aria-selected="true"]:hover .sq{background:var(--cyan)}
  .brand{display:none}
  @media (max-width:899px){
    .nav{left:0;right:0;bottom:0;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
    .nav .items{justify-content:space-around;max-width:520px;margin:0 auto}
    .navbtn .sq{width:44px;height:32px;border-radius:9px}
  }
  @media (min-width:900px){
    .nav{top:0;bottom:0;left:0;width:calc(var(--navw) + env(safe-area-inset-left,0px));padding:calc(20px + env(safe-area-inset-top,0px)) 0 20px env(safe-area-inset-left,0px);display:flex;flex-direction:column;align-items:center;gap:28px}
    .nav .items{flex-direction:column;gap:14px}
    .brand{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--navy);color:var(--card);font-weight:800;font-size:1.05rem}
  }

  /* Feuilles (formulaires) */
  .sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(11,31,58,.35);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:14px 14px 0 0;box-shadow:var(--shadow-lg);
    padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
  @media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field input,.field select,.in{font:inherit;color:var(--navy);padding:11px 12px;border-radius:8px;border:0;background:var(--bg);width:100%;min-width:0}
  .field input.bigin{font-size:1.6rem;font-weight:700}
  .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .actions-row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .lrow{display:grid;gap:8px;align-items:center}
  .lrow.repas{grid-template-columns:112px minmax(0,1fr) 40px}
  .lrow.exo{grid-template-columns:minmax(0,1fr) 62px 62px 40px}
  .lrow .x{width:40px;height:40px;border-radius:8px;background:var(--rail);display:grid;place-items:center;color:var(--grey)}
  .lrow .x:hover{background:var(--down-soft);color:var(--down)}
  .lhead{font-size:.72rem;color:var(--grey);font-weight:600}
  .add{background:var(--cyan-soft);color:var(--navy);font-weight:600;border-radius:8px;padding:10px 14px;text-align:left;font-size:.88rem;min-height:40px}
  .add:hover{background:var(--cyan-mid)}
  .wset{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
  .wex{display:flex;flex-direction:column;gap:8px;padding:12px 0}
  .wex+.wex{box-shadow:inset 0 1px 0 var(--rail)}
  .login{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
  .linkbtn{color:var(--grey);text-decoration:underline;font-size:.85rem;align-self:flex-start}
  .curve svg{width:100%;height:auto;max-height:200px;display:block;overflow:visible}
  .kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-size:.9rem}
  .kv+.kv{box-shadow:inset 0 1px 0 var(--rail)}
  .kv .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  </style>
</head>
<body>

<nav class="nav" aria-label="Sections">
  <div class="brand" aria-hidden="true">W</div>
  <div class="items" role="tablist">
    <button class="navbtn tab" role="tab" data-tab="jour" aria-selected="true"><span class="sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Aujourd'hui</button>
    <button class="navbtn tab" role="tab" data-tab="planning"><span class="sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg></span>Planning</button>
    <button class="navbtn tab" role="tab" data-tab="seances"><span class="sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Séances</button>
    <button class="navbtn tab" role="tab" data-tab="cuisine"><span class="sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0zM8 7.5c0-1.5 1-2 1-3.5M12 7.5c0-1.5 1-2 1-3.5M16 7.5c0-1.5 1-2 1-3.5"/></svg></span>Cuisine</button>
  </div>
</nav>

  <main id="view"></main>
</div>

<script>
/* ---------- Données ---------- */
const TYPES={petitdej:"Petit-déj",repas:"Repas",collation:"Collation"};
const HEURE_TYPE={petitdej:"07:30",repas:"12:30",collation:"16:30"};
const DOW=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const DOW_LONG=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const DEFAULT={profil:{lever:"07:00",sommeil:8,prot:0,kcal:0,objectif:80},seances:[],plats:[],type:{},jours:{},logs:[],poids:[]};
const E=(id,nom,series,reps)=>({id,nom,series,reps});
const T=(s,h,r)=>({seance:s?{id:s,heure:h}:null,repas:r.map(([plat,heure])=>({plat,heure}))});
const R4=[["p3","07:30"],["p1","12:30"],["p6","16:30"],["p2","20:00"]], R3=[["p4","09:30"],["p5","13:00"],["p2","20:00"]];
// Point de départ du premier lancement : tout est modifiable dans l'appli
const SEED={profil:{lever:"07:00",sommeil:8,prot:0,kcal:0,objectif:80},
 seances:[

/* ---------- Progression des charges ---------- */
function dernierLog(exoId){
  for(let i=S.logs.length-1;i>=0;i--){const e=S.logs[i].exos.find(x=>x.exoId===exoId&&x.sets.some(s=>+s.kg>0||+s.reps>0));if(e)return {date:S.logs[i].date,sets:e.sets}}
  return null;
}
function conseil(exo){
  const l=dernierLog(exo.id); if(!l)return null;
  const faits=l.sets.filter(s=>+s.reps>0), kg=Math.max(0,...faits.map(s=>+s.kg||0));
  const reussi=faits.length>=exo.series&&faits.every(s=>+s.reps>=exo.reps);
  return {kg, reps:faits.length?Math.min(...faits.map(s=>+s.reps)):0, plus:reussi&&kg>0, prochain:reussi&&kg>0?kg+2.5:kg, date:l.date};
}
function record(exoId){let m=0;S.logs.forEach(l=>l.exos.forEach(e=>{if(e.exoId===exoId)e.sets.forEach(s=>{if(+s.reps>0)m=Math.max(m,+s.kg||0)})}));return m}

function courbePoids(){
  const pts=[...S.poids].sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2)return `<p class="empty">${pts.length?"Encore une pesée et la courbe apparaît.":"Note ton poids quand tu y penses : la courbe se construit toute seule."}</p>`;
  const W=600,H=160,P={l:8,r:56,t:14,b:22}, obj=+S.profil.objectif||80;
  const ks=pts.map(p=>p.kg), mn=Math.min(...ks,obj)-1, mx=Math.max(...ks,obj)+1;
  const t0=parse(pts[0].date).getTime(), t1=parse(pts[pts.length-1].date).getTime()||t0+1;
  const X=d=>P.l+(parse(d).getTime()-t0)/Math.max(1,t1-t0)*(W-P.l-P.r), Y=v=>H-P.b-(v-mn)/(mx-mn)*(H-P.t-P.b);
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(p.date).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(" ");
  const last=pts[pts.length-1];
  return `<div class="curve"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du poids, dernier ${num(last.kg)} kg, objectif ${num(obj)} kg">
    <line x1="${P.l}" x2="${W-P.r}" y1="${Y(obj)}" y2="${Y(obj)}" stroke="#6B7280" stroke-opacity=".5" stroke-dasharray="4 5"/><text x="${W-P.r+6}" y="${Y(obj)+4}" font-size="11" fill="#6B7280">${num(obj)} kg</text>
    <path d="${line}" fill="none" stroke="#00A8C6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.kg)}" r="3" fill="#00A8C6"/>`).join("")}
    <text x="${X(last.date)+6}" y="${Y(last.kg)-8}" font-size="12" font-weight="700" fill="#0B1F3A" text-anchor="end">${num(last.kg)} kg</text>
    <text x="${P.l}" y="${H-4}" font-size="11" fill="#6B7280">${parse(pts[0].date).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text>
    <text x="${W-P.r}" y="${H-4}" font-size="11" fill="#6B7280" text-anchor="end">${parse(last.date).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text></svg></div>`;
}

function wireDrag(){

function modal(inner,onOpen){
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<form class="sheet" novalidate>${inner}</form>`;
  document.body.appendChild(bg);
  const close=()=>{bg.remove();if(differe){differe=false;setTimeout(()=>loadRemote(true),600)}};
  bg.addEventListener("mousedown",e=>{if(e.target===bg)close()});
  bg.querySelector("form").addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  onOpen&&onOpen(bg.querySelector("form"),close);

}
const footer=del=>`<p class="err" style="margin:0;color:var(--down);font-size:.88rem" hidden></p>

function wireFooter(f,close,onSave,onDel){

      <div style="box-shadow:inset 0 1px 0 var(--rail);padding-top:12px;display:flex;flex-direction:column;gap:8px">
        <span class="label">Synchronisation : ${esc($("synctxt").textContent)}</span>
        <div class="acts">${code?`<button type="button" class="btn danger" id="lock">Verrouiller cet appareil</button>`:sb?`<button type="button" class="btn soft" id="unlock">Entrer mon code</button>`:""}<button type="button" class="btn plain" id="reset">Tout remettre à zéro</button></div></div>`}],
    ()=>{const f=document.querySelector(".sheet");const g=n=>parseFloat(String(f.querySelector(`[name="${n}"]`).value).replace(",","."));
      p.lever=f.querySelector('[name="lever"]').value||"07:00";p.sommeil=g("sommeil")||8;p.prot=g("prot")||0;p.kcal=g("kcal")||0;p.objectif=g("objectif")||80});
  const f=document.querySelector(".sheet"), close=()=>f.parentElement.remove();
  $("lock")&&($("lock").onclick=()=>{oublierCode();try{localStorage.removeItem(LS_KEY)}catch(e){}S=structuredClone(DEFAULT);pinMsg="";offline=false;close();render();setSync("local","Code requis")});
  $("unlock")&&($("unlock").onclick=()=>{offline=false;close();render()});
  let arme=false;
  $("reset").onclick=()=>{if(!arme){arme=true;$("reset").textContent="Confirmer : tout effacer (séances, plats, historique)";return}S=structuredClone(SEED);save();render();close()};
}

function act(a,id){
  if(a==="tab"){tab=id;render();window.scrollTo(0,0);return}
  if(a==="mange"){const[d,i]=id.split("|");const j=fige(d);const r=j.repas[+i];if(r){r.mange=!r.mange;save();render()}return}
  if(a==="day")return daySheet(id,false);
  if(a==="dayType")return daySheet(+id,true);
  if(a==="move")return moveSheet(id);
  if(a==="go"){const[s,d]=id.split("|");return workout(s,d)}
  if(a==="wk"){wkOff+=+id;render();return}
  if(a==="modePlan"){modePlan=id;render();return}
  if(a==="modeSea"){modeSea=id;render();return}
  if(a==="filtre"){filtre=id;render();return}
  if(a==="newSeance")return seanceSheet(null);
  if(a==="editSeance")return seanceSheet(seanceOf(id));
  if(a==="poids"){const d=today(), cur=S.poids.find(p=>p.date===d);
    return sheet("Mon poids aujourd'hui",[{name:"kg",label:"Poids (kg)",type:"number",big:1,step:"0.1",value:cur?.kg??dernierPoids()?.kg??""}],
      v=>{if(!(v.kg>20&&v.kg<300))return "Entre ton poids en kg.";S.poids=S.poids.filter(p=>p.date!==d);S.poids.push({date:d,kg:Math.round(v.kg*10)/10})},
      cur?()=>{S.poids=S.poids.filter(p=>p.date!==d)}:null)}
  if(a==="newPlat"||a==="editPlat"){const p=a==="editPlat"?platOf(id):{type:filtre!=="tout"?filtre:"repas"};
    return sheet(p.id?"Modifier le plat":"Nouveau plat",[
      {name:"nom",label:"Nom",value:p.nom,ph:"Poulet, riz, brocoli"},
      {name:"type",label:"Moment",type:"seg",options:TYPES,value:p.type||"repas"},
      {type:"html",html:`<div class="row2"><label class="field"><span class="label">Protéines (g)</span><input name="prot" type="number" inputmode="decimal" step="any" min="0" value="${p.prot??""}"></label><label class="field"><span class="label">Calories (kcal)</span><input name="kcal" type="number" inputmode="numeric" min="0" value="${p.kcal??""}"></label></div>`}],
      v=>{const f=document.querySelector(".sheet");const prot=parseFloat(String(f.querySelector('[name="prot"]').value).replace(",","."))||0,kcal=parseFloat(f.querySelector('[name="kcal"]').value)||0;
        if(!v.nom)return "Donne un nom au plat.";Object.assign(p,{nom:v.nom,type:v.type||"repas",prot,kcal});if(!p.id){p.id=uid();S.plats.push(p)}},
      p.id?()=>{S.plats=S.plats.filter(x=>x.id!==p.id)}:null)}
  if(a==="placer"){const p=platOf(id);if(!p)return;const t=today();
    const opts=Object.fromEntries([0,1,2,3,4,5,6].map(i=>{const d=addD(t,i);return [d,shortDate(d)+(i>1?" "+parse(d).toLocaleDateString("fr-FR",{month:"short"}):"")]}));
    return sheet(`Placer ${esc(p.nom)}`,[{name:"j",label:"Jour",type:"select",options:opts,value:t},{name:"h",label:"Heure",type:"time",value:HEURE_TYPE[p.type]||"12:30"}],
      v=>{fige(v.j).repas.push({id:uid(),plat:p.id,heure:v.h||"12:30",mange:false})})}
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
$("sync").onclick=()=>{if(sb&&!code&&!offline)return;reglages()};
connect();
</script>
